name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端 语法 & 启动冒烟
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall app

      - name: 模块导入检查
        run: python -c "from app.main import app; assert app.title"

      - name: 启动冒烟测试（/api/health）
        run: |
          (python app/main.py > /tmp/backend.log 2>&1 &) && \
          for i in $(seq 1 20); do \
            curl -sf http://localhost:8000/api/health && exit 0; \
            sleep 2; \
          done; \
          echo "--- 后端日志 ---"; cat /tmp/backend.log; exit 1

  frontend:
    name: 前端 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 生产构建
        run: npm run build
